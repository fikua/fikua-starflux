name: Release
on:
  push:
    tags:
      - "v*"

jobs:
  build-linux:
    name: Build (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Cross-compile
        run: |
          FYNE_CROSS=$(cd tools && go tool -n fyne-cross)
          "$FYNE_CROSS" linux -arch=amd64,arm64 -app-id=org.fikua.starflux ./cmd/starflux
      - name: Package artifacts
        run: |
          mkdir -p release
          for d in fyne-cross/dist/linux-*/; do
            arch=$(basename "$d")
            (cd "$d" && tar -czf "../../../release/starflux-${arch}.tar.gz" .)
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-linux
          path: release/*

  build-windows:
    name: Build (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Package
        shell: pwsh
        run: |
          Push-Location tools
          $fyne = go tool -n fyne
          Pop-Location
          & $fyne package -os windows -app-id org.fikua.starflux -src .\cmd\starflux
      - name: Build installer with Inno Setup
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          New-Item -ItemType Directory -Force -Path release | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" `
            "/DMyAppVersion=$version" `
            "/DSrcDir=$PWD\cmd\starflux" `
            "/DOutDir=$PWD\release" `
            packaging\windows\starflux.iss
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-windows
          path: release/*

  build-darwin:
    name: Build (darwin)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Install create-dmg
        run: brew install create-dmg
      - name: Package and build dmg
        run: |
          FYNE=$(cd tools && go tool -n fyne)
          mkdir -p release
          for arch in amd64 arm64; do
            rm -rf starflux.app
            GOARCH=$arch "$FYNE" package -os darwin -app-id org.fikua.starflux -src ./cmd/starflux
            create-dmg \
              --volname "Starflux" \
              --app-drop-link 450 150 \
              --icon "starflux.app" 150 150 \
              --window-size 600 300 \
              "release/starflux-darwin-${arch}.dmg" \
              "starflux.app"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-darwin
          path: release/*

  hash:
    name: Hash artifacts
    needs: [build-linux, build-windows, build-darwin]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - id: hash
        working-directory: release
        run: echo "hashes=$(sha256sum * | base64 -w0)" >> "$GITHUB_OUTPUT"
      - name: Create release and upload binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" release/* \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes

  provenance:
    needs: [hash]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.hash.outputs.hashes }}"
      upload-assets: true
