name: Release
on:
  push:
    tags:
      - "v*"

jobs:
  build-cross:
    name: Build (${{ matrix.os }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [linux, windows]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Install fyne-cross
        run: go install github.com/fyne-io/fyne-cross@v1.6.3
      - name: Cross-compile
        run: fyne-cross ${{ matrix.os }} -arch=amd64,arm64 -app-id=org.fikua.starflux ./cmd/starflux
      - name: Package artifacts
        run: |
          mkdir -p release
          for d in fyne-cross/dist/${{ matrix.os }}-*/; do
            arch=$(basename "$d")
            (cd "$d" && tar -czf "../../../release/starflux-${arch}.tar.gz" .)
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.os }}
          path: release/*

  build-darwin:
    name: Build (darwin)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Install fyne CLI
        run: go install fyne.io/tools/cmd/fyne@v1.7.2
      - name: Package
        run: |
          mkdir -p release
          for arch in amd64 arm64; do
            GOARCH=$arch fyne package -os darwin -app-id org.fikua.starflux -src ./cmd/starflux
            mv starflux.app "release/Starflux-darwin-${arch}.app"
            (cd release && zip -qr "starflux-darwin-${arch}.zip" "Starflux-darwin-${arch}.app" && rm -rf "Starflux-darwin-${arch}.app")
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-darwin
          path: release/*

  hash:
    name: Hash artifacts
    needs: [build-cross, build-darwin]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - id: hash
        working-directory: release
        run: echo "hashes=$(sha256sum * | base64 -w0)" >> "$GITHUB_OUTPUT"
      - name: Create release and upload binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" release/* \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes

  provenance:
    needs: [hash]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.hash.outputs.hashes }}"
      upload-assets: true
