sonar.projectKey=fikua_fikua-starflux
sonar.organization=fikua

sonar.projectName=fikua-starflux

# Path is relative to the sonar-project.properties file.
sonar.sources=.
sonar.exclusions=**/*_test.go

sonar.tests=.
sonar.test.inclusions=**/*_test.go

sonar.go.coverage.reportPaths=coverage.out

# cmd/starflux is Fyne window/widget wiring exercised by running the real
# app, not unit-testable business logic — excluded from the coverage
# calculation (not from analysis: bugs/smells there are still reported).
sonar.coverage.exclusions=cmd/starflux/**

sonar.sourceEncoding=UTF-8
